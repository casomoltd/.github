name: Add to Casomo Workboard

on:
  workflow_call:

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.WORKBOARD_APP_ID }}
          private-key: ${{ secrets.WORKBOARD_APP_PRIVATE_KEY }}
          owner: casomoltd

      - uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/orgs/casomoltd/projects/3
          github-token: ${{ steps.app-token.outputs.token }}
